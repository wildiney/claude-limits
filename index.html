<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Limit Tracker</title>
    <link rel="icon" href="https://anthropic.com/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('claude_settings'));
          if (s && s.darkMode === true) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen">
    <div id="app" class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Claude Limit Tracker</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400" id="current-status-text">Calculando status...</p>
            </div>
            <button id="btn-settings" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600 dark:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </header>

        <!-- Main Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Progress Ring Card -->
            <div class="md:col-span-1 bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col items-center justify-center">
                <div class="relative w-40 h-40">
                    <svg class="w-full h-full" viewBox="0 0 100 100">
                        <circle class="text-slate-100 dark:text-slate-700 stroke-current" stroke-width="8" fill="transparent" r="42" cx="50" cy="50"/>
                        <circle id="progress-circle" class="text-blue-500 stroke-current progress-ring__circle" stroke-width="8" stroke-linecap="round" fill="transparent" r="42" cx="50" cy="50" stroke-dasharray="263.89" stroke-dashoffset="263.89"/>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="current-usage-val" class="text-3xl font-bold text-slate-800 dark:text-slate-100">0%</span>
                        <span class="text-xs text-slate-400 uppercase font-semibold">Uso Atual</span>
                    </div>
                </div>
                <div class="mt-4 text-center">
                    <p class="text-sm font-medium text-slate-600 dark:text-slate-300">Ideal: <span id="ideal-usage-val">0%</span></p>
                    <p id="diff-text" class="text-xs font-semibold mt-1">Status: OK</p>
                </div>
            </div>

            <!-- Controls and Stats -->
            <div class="md:col-span-2 space-y-6">
                <!-- Usage Input (Slider) -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200">Atualizar Uso</h2>
                        <span id="slider-val" class="text-xl font-bold text-blue-600">0%</span>
                    </div>
                    <input type="range" id="usage-slider" min="0" max="100" value="0" step="1"
                           class="w-full h-3 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    <div class="flex justify-between mt-2 text-xs text-slate-400 dark:text-slate-500">
                        <span>0%</span>
                        <span>50%</span>
                        <span>100%</span>
                    </div>
                </div>

                <!-- Cycle Info -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
                        <p class="text-xs text-slate-400 dark:text-slate-500 mb-1 uppercase font-bold">Próximo Reset</p>
                        <p id="next-reset-time" class="text-sm font-semibold text-slate-700 dark:text-slate-200">Carregando...</p>
                    </div>
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
                        <p class="text-xs text-slate-400 dark:text-slate-500 mb-1 uppercase font-bold">Tempo Restante</p>
                        <p id="time-remaining" class="text-sm font-semibold text-slate-700 dark:text-slate-200">Carregando...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Chart -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 mb-8">
            <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200 mb-6">Histórico Semanal</h2>
            <div class="h-64">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Settings Modal (Hidden by default) -->
    <div id="modal-settings" class="fixed inset-0 bg-slate-900/50 dark:bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md p-8 rounded-2xl shadow-xl mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">Configurações</h2>
                <button id="close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Início do Ciclo Atual</label>
                    <div class="flex gap-2">
                        <input type="datetime-local" id="cycle-start"
                               class="flex-1 p-2 rounded-lg border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="btn-register-reset"
                                class="px-3 py-2 text-xs font-semibold bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg transition-colors whitespace-nowrap">
                            Agora
                        </button>
                    </div>
                    <p class="mt-1 text-xs text-slate-400">Atualize quando perceber que o Claude renovou.</p>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100 dark:border-slate-700 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Início Jornada</label>
                        <input type="time" id="work-start" value="08:00" class="w-full p-2 rounded-lg border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Fim Jornada</label>
                        <input type="time" id="work-end" value="20:00" class="w-full p-2 rounded-lg border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Editar Histórico -->
                <div class="pt-2 border-t border-slate-100 dark:border-slate-700 mt-4">
                    <h3 class="text-sm font-medium text-slate-600 dark:text-slate-300 mb-3">Editar Histórico</h3>
                    <div id="history-edit-list" class="space-y-2"></div>
                </div>

                <!-- Dark Mode Toggle -->
                <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700 mt-4">
                    <label class="text-sm font-medium text-slate-600 dark:text-slate-300">Modo Escuro</label>
                    <button id="toggle-dark-mode" role="switch" aria-checked="false"
                            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors bg-slate-200">
                        <span id="toggle-dark-mode-thumb"
                              class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform translate-x-1">
                        </span>
                    </button>
                </div>
            </div>

            <button id="save-settings" class="w-full mt-8 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors">
                Salvar Alterações
            </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
